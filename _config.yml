
url: 'http://Vinaygond.github.io'
baseurl: ''

title: Vinay


description: I bet everyday!


navbar-links:
  Projects: 'projects'
  Technical Arsenal: 'technicalskills'
  Publications: 'publications'
  My Resume: 'Resume.pdf'
  About Me: 'aboutme'
  # Contact: 'contact'
  # Dropdown menu in Navbar
  # Resources:
  #   - Learn markdown: "http://www.markdowntutorial.com/"
  #   - GitHub Pages: "https://pages.github.com/"


avatar: '/img/homephoto1.jpg'



navbar-col: '#111111'
navbar-text-col: '#EAEAEA'
navbar-children-col: '#1a1a1a'
page-col: '#111111'
link-col: '#3B82F6'
hover-col: '#60A5FA'
footer-col: '#111111'
footer-text-col: '#888888'
footer-link-col: '#EAEAEA'


author:
  name: Vinay

social-network-links:
  rss: false
  email: 'vinay@xleadscraper.com'
  #facebook: 
  #github: 
  twitter: vvgond
  #  reddit: yourname
  instagram: thevclass
  linkedin: vinaygo
 
share-links-active:
  twitter: true
  facebook: false
  google: true
  linkedin: true
  instagram: true


disqus: 'vinay'

excerpt_length: 50


title-separator: '-'



timezone: 'Asia/Kolkata'
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM
defaults:
  - scope:
      path: ''
      type: 'posts'
    values:
      layout: 'post'
      comments: true 
      social-share: true 
  - scope:
      path: '' # all files
    values:
      layout: 'page'
      show-avatar: true

link-tags: true

exclude:
  - CHANGELOG.md
  - CNAME
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - Vagrantfile

# prose.io config
prose:
  rooturl: '_posts'
  media: 'img'
  ignore:
    - 404.html
    - LICENSE
    - feed.xml
    - _config.yml
    - /_layouts
    - /_includes
    - /css
    - /img
    - /js
  metadata:
    _posts:
      - name: 'layout'
        field:
          element: 'hidden'
          value: 'post'
      - name: 'title'
        field:
          element: 'text'
          label: 'Post title'
          placeholder: 'Title'
          alterable: true
      - name: 'subtitle'
        field:
          element: 'textarea'
          label: 'Subtitle'
          placeholder: 'A description of your post.'
          alterable: true
      - name: 'date'
        field:
          element: 'text'
          label: 'Date'
          help: 'Enter date of post.'
          placeholder: 'yyyy-mm-dd'
          alterable: true
      - name: 'image'
        field:
          element: 'text'
          label: 'Image'
          help: 'Add a thumbnail image to your post.'
          placeholder: 'Thumbnail'
          alterable: true
      - name: 'published'
        field:
          element: 'checkbox'
          label: 'Publish'
          help: 'Check to publish post, uncheck to hide.'

plugins:
  - jekyll-paginate
  - jekyll-sitemap
