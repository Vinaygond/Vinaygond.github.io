name: Portfolio checks
on:
  push:
    branches: [master, feat/evidence-led-career-portfolio]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:site
      - name: Rebuild resume from shared source
        run: npm run resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-preview
          path: |
            _site/
            qa-artifacts/
          retention-days: 7
